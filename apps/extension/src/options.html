<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Page2Reading 设置</title>
    <style>
      body {
        font-family: "PingFang SC", sans-serif;
        background: #f6f1e8;
        color: #1c1917;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
      }
      label {
        display: block;
        margin: 16px 0 6px;
        font-size: 13px;
      }
      input {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #d6c7b2;
        box-sizing: border-box;
      }
      button {
        margin-top: 18px;
        padding: 8px 14px;
        border: 0;
        border-radius: 6px;
        background: #1c1917;
        color: #fff;
      }
      p {
        color: #57534e;
        font-size: 13px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>Page2Reading 设置</h1>
    <p>本地服务默认监听 127.0.0.1:17321。令牌在首次启动服务时打印，并保存在 ~/.page2reading/config.json。</p>
    <label>
      服务地址
      <input id="baseUrl" />
    </label>
    <label>
      鉴权令牌
      <input id="token" />
    </label>
    <button id="save" type="button">保存</button>
    <p id="status"></p>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
