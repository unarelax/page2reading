<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Page2Reading 设置</title>
    <style>
      body {
        font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
        background: #f6f1e8;
        color: #1c1917;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 20px;
      }
      label {
        display: block;
        margin: 16px 0 6px;
        font-size: 13px;
      }
      input,
      select {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #d6c7b2;
        box-sizing: border-box;
        background: #fff;
      }
      button {
        margin-top: 14px;
        padding: 8px 14px;
        border: 0;
        border-radius: 6px;
        background: #1c1917;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #1c1917;
        border: 1px solid #d6c7b2;
      }
      p {
        color: #57534e;
        font-size: 13px;
        line-height: 1.6;
      }
      .hint {
        font-size: 12px;
        color: #8a8177;
        margin-top: 4px;
      }
      a {
        color: #57534e;
      }
    </style>
  </head>
  <body>
    <h1>Page2Reading 设置</h1>

    <label for="apiKey">DeepSeek API Key</label>
    <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
    <p class="hint">
      还没有 Key？
      <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noreferrer">去 DeepSeek 开放平台获取</a>
    </p>

    <label for="model">模型</label>
    <select id="model">
      <option value="deepseek-flash">DeepSeek-V4.1-Flash（deepseek-flash，默认，快而省）</option>
      <option value="deepseek-chat">DeepSeek-V3.2（deepseek-chat，通用）</option>
    </select>

    <label>本地保存目录</label>
    <button id="pick-dir" type="button" class="secondary">选择目录</button>
    <button id="reauth" type="button" class="secondary" style="display: none">重新授权</button>
    <p id="dir-status" class="hint">尚未选择保存目录</p>

    <button id="save" type="button">保存</button>
    <p id="status"></p>

    <script type="module" src="./settings.ts"></script>
  </body>
</html>
